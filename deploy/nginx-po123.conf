server {
    listen 8083;
    server_name _;

    root /home/it/po123/ui/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    # Kiểm tra UI sống, dùng cho smoke test.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # UI gọi API qua cùng origin; Nginx chuyển xuống API local.
    location /api/ {
        proxy_pass http://127.0.0.1:2405;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # SPA: đường dẫn không khớp file thì trả index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
